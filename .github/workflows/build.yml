name: Build Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libtinfo5 libxml2-dev libssl-dev pkg-config uuid-dev libplist++-dev libplist-dev
        
    - name: Clone Theos
      run: |
        git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git ../theos
        
    - name: Clone iOS SDK
      run: |
        rm -rf ../theos/sdks
        git clone --depth 1 --branch master --single-branch https://github.com/theos/sdks.git ../theos/sdks
        
    - name: Install toolchain
      run: |
        cd ../theos
        make install-tc
        
    - name: Build
      run: |
        export THEOS=../theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package FINALPACKAGE=1 ARCHS="arm64"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: stheno-boundary-arm64
        path: packages/*.deb
        if-no-files-found: error
