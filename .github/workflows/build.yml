name: Build Theos Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git libtinfo5 libxml2-dev libssl-dev pkg-config uuid-dev libplist++-dev libplist-dev
        
    - name: Clone Theos
      run: |
        git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git ../theos
        
    - name: Download iOS SDK
      run: |
        cd ../theos/sdks
        curl -L -o iPhoneOS16.5.sdk.tar.gz "https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.gz" --retry 3 --retry-delay 10 || \
        curl -L -o iPhoneOS16.5.sdk.tar.gz "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz" --retry 3 --retry-delay 10
        ls -la
        
    - name: Build
      run: |
        export THEOS=../theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package FINALPACKAGE=1 ARCHS="arm64"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: stheno-boundary-arm64
        path: packages/*.deb
        if-no-files-found: error
